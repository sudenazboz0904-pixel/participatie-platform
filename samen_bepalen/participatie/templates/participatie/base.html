{% load static %}
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Samen Bepalen — Gemeentebelangen Gouda{% endblock %}</title>

    <!-- Bootstrap 5 voor nette opmaak zonder veel eigen CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap iconen -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        /* Kleurenpalet: Rood en Wit */
        :root {
            --gb-rood: #c41c3b;
            --gb-wit: #ffffff;
            --gb-lichtgrijs: #f8f9fa;
        }

        body {
            background-color: var(--gb-wit);
            font-family: 'Segoe UI', sans-serif;
            color: #333;
        }

        /* Navigatiebalk */
        .navbar {
            background-color: var(--gb-rood) !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.2rem;
            color: white !important;
        }

        .navbar .nav-link {
            color: rgba(255,255,255,0.85) !important;
        }

        .navbar .nav-link:hover {
            color: var(--gb-wit) !important;
        }

        /* Knop in rood accent */
        .btn-accent {
            background-color: var(--gb-rood);
            color: white;
            border: none;
            font-weight: 600;
        }

        .btn-accent:hover {
            background-color: #a01729;
            color: white;
        }

        /* Hero-banner bovenaan de homepage */
        .hero-banner {
            background: linear-gradient(135deg, var(--gb-rood), #8b1630);
            color: white;
            padding: 3rem 0;
            margin-bottom: 2.5rem;
        }

        /* Voorstelkaart */
        .proposal-card {
            background: white;
            border-radius: 10px;
            border: 2px solid var(--gb-rood);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            height: 100%;
        }

        .proposal-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(196,28,59,0.15);
        }

        .vote-count {
            font-size: 2rem;
            font-weight: 800;
            color: var(--gb-rood);
        }

        .vote-label {
            font-size: 0.75rem;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Footer */
        footer {
            background-color: var(--gb-rood);
            color: rgba(255,255,255,0.7);
            padding: 2rem 0;
            margin-top: 4rem;
        }
    </style>
</head>
<body>

<!-- ===== NAVIGATIEBALK ===== -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="{% url 'index' %}" style="display: flex; align-items: center; gap: 10px;">
            <img src="{% static 'images/gbg-logo.svg' %}" alt="GBG Logo" style="height: 50px; width: auto;">
            <span>Samen Bepalen</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'index' %}"><i class="bi bi-house me-1"></i>Alle voorstellen</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'submit' %}"><i class="bi bi-plus-circle me-1"></i>Voorstel indienen</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ===== HOOFDINHOUD (ingevuld door child-templates) ===== -->
<main>
    {% block content %}{% endblock %}
</main>

<!-- ===== FOOTER ===== -->
<footer>
    <div class="container text-center">
        <p class="mb-1"><strong>Gemeentebelangen Gouda</strong> — Samen Bepalen</p>
        <p class="mb-0" style="font-size:0.85rem;">Een platform voor inwoners van Gouda</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
