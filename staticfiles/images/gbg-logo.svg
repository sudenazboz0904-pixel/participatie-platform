<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" width="1280" height="860">
  <!-- Top red banner -->
  <rect width="1280" height="190" fill="#c41c3b"/>

  <!-- White middle section -->
  <rect y="190" width="1280" height="480" fill="white"/>

  <!-- Bottom red banner -->
  <rect y="670" width="1280" height="190" fill="#c41c3b"/>

  <!-- Left shield with crown and stars -->
  <g id="left-shield">
    <!-- Shield shape -->
    <path d="M 40 260 L 120 280 L 120 500 Q 120 580 40 620 Q -40 580 -40 500 L -40 280 Z" fill="#c41c3b"/>
    <!-- Crown peaks -->
    <polygon points="0,-20 30,-5 15,15 45,5 30,25 60,15 40,35 70,25 45,40 75,35" fill="#c41c3b"/>
    <!-- Stars in shield (6 stars in 2 rows) -->
    <g fill="white">
      <!-- Top row of stars -->
      <polygon points="0,350 8,370 28,370 12,382 20,402 0,390 -20,402 -12,382 -28,370 -8,370" transform="translate(-40, 0)"/>
      <polygon points="0,350 8,370 28,370 12,382 20,402 0,390 -20,402 -12,382 -28,370 -8,370" transform="translate(0, 0)"/>
      <polygon points="0,350 8,370 28,370 12,382 20,402 0,390 -20,402 -12,382 -28,370 -8,370" transform="translate(40, 0)"/>
      <!-- Bottom row of stars -->
      <polygon points="0,350 8,370 28,370 12,382 20,402 0,390 -20,402 -12,382 -28,370 -8,370" transform="translate(-40, 80)"/>
      <polygon points="0,350 8,370 28,370 12,382 20,402 0,390 -20,402 -12,382 -28,370 -8,370" transform="translate(0, 80)"/>
      <polygon points="0,350 8,370 28,370 12,382 20,402 0,390 -20,402 -12,382 -28,370 -8,370" transform="translate(40, 80)"/>
    </g>
  </g>

  <!-- Right shield (mirror) -->
  <g id="right-shield" transform="translate(1280, 0) scale(-1, 1)">
    <!-- Shield shape -->
    <path d="M 40 260 L 120 280 L 120 500 Q 120 580 40 620 Q -40 580 -40 500 L -40 280 Z" fill="#c41c3b"/>
    <!-- Crown peaks -->
    <polygon points="0,-20 30,-5 15,15 45,5 30,25 60,15 40,35 70,25 45,40 75,35" fill="#c41c3b"/>
    <!-- Stars in shield (6 stars in 2 rows) -->
    <g fill="white">
      <!-- Top row of stars -->
      <polygon points="0,350 8,370 28,370 12,382 20,402 0,390 -20,402 -12,382 -28,370 -8,370" transform="translate(-40, 0)"/>
      <polygon points="0,350 8,370 28,370 12,382 20,402 0,390 -20,402 -12,382 -28,370 -8,370" transform="translate(0, 0)"/>
      <polygon points="0,350 8,370 28,370 12,382 20,402 0,390 -20,402 -12,382 -28,370 -8,370" transform="translate(40, 0)"/>
      <!-- Bottom row of stars -->
      <polygon points="0,350 8,370 28,370 12,382 20,402 0,390 -20,402 -12,382 -28,370 -8,370" transform="translate(-40, 80)"/>
      <polygon points="0,350 8,370 28,370 12,382 20,402 0,390 -20,402 -12,382 -28,370 -8,370" transform="translate(0, 80)"/>
      <polygon points="0,350 8,370 28,370 12,382 20,402 0,390 -20,402 -12,382 -28,370 -8,370" transform="translate(40, 80)"/>
    </g>
  </g>

  <!-- GBG Main Text -->
  <text x="640" y="580" font-size="380" font-weight="bold" fill="#c41c3b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" letter-spacing="20">GBG</text>

  <!-- "De burger centraal" subtitle -->
  <text x="640" y="720" font-size="80" fill="#c41c3b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-style="italic">De burger centraal</text>
</svg>

